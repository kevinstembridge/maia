<h2 mat-dialog-title>{{data.enable ? 'Enable' : 'Disable'}} Feature Toggle</h2>
<form [formGroup]="form" (ngSubmit)="onConfirm()">
    <mat-dialog-content>
        <p>{{data.enable ? 'Enable' : 'Disable'}} <strong>{{data.featureName}}</strong>?</p>
        <mat-form-field>
            <mat-label>Comment (optional)</mat-label>
            <input matInput name="comment" formControlName="comment">
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-flat-button type="submit" [color]="data.enable ? 'primary' : 'warn'">{{data.enable ? 'Enable' : 'Disable'}}</button>
    </mat-dialog-actions>
</form>
