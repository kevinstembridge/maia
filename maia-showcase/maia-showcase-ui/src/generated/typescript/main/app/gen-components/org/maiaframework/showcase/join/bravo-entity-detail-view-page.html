<maia-page-layout pageTitle="Bravo" dataPageId="bravo_view">
    @if (entityId(); as id) {
        <app-bravo-entity-detail-view [entityId]="id" />
    }
    <button matButton aria-label="Blotter" (click)="onBlotterClicked()">
        <mat-icon>list</mat-icon>
        Go to Blotter
    </button>
    @if (canEdit && entityId()) {
        <button matButton aria-label="Edit" (click)="onEditClicked()">
            <mat-icon>edit</mat-icon>
            Edit
        </button>
    }
</maia-page-layout>
