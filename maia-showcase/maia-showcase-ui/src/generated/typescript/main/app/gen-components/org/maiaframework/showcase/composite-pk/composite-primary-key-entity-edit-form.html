<form novalidate (submit)="onSubmit($event)">
    <div>
        @if (problemDetail()) {
            <p class="alert alert-warning" role="alert">{{ problemDetail()!.title }}</p>
        }
        <mat-form-field appearance="outline">
            <mat-label>Some Modifiable String</mat-label>
            <input
                [formField]="dialogForm.someModifiableString"
                id="someModifiableString"
                type="text"
                matInput
            />

            @if (dialogForm.someModifiableString().touched() && dialogForm.someModifiableString().invalid()) {
                @for (error of dialogForm.someModifiableString().errors(); track error) {
                    <mat-error>{{ error.message }}</mat-error>
                }
            }

        </mat-form-field>
    </div>
    <div class="form-actions">
        <button mat-flat-button type="submit" color="primary">Submit</button>
        <button mat-flat-button type="button" (click)="onCancelClicked()">Cancel</button>
    </div>
</form>
